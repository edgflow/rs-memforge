[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[package]
name = "memforge"
description = "MEMFORGE: a small persistent key-value storage engine in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
memforge-core = { path = "crates/memforge-core" }
memforge-engine = { path = "crates/memforge-engine" }
